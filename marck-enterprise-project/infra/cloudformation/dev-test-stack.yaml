AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Marck Enterprise developer test environment (Multi-Tier Architecture case study).
  Web tier in a public subnet, app tier in a private subnet, RDS MySQL in private subnets.
  Developers launch it from Service Catalog. Deleting the stack keeps the database
  (and the VPC pieces it sits in) so test data survives.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Access }
        Parameters: [AllowedSshCidr, KeyName]
      - Label: { default: Sizing }
        Parameters: [InstanceType, DBInstanceClass]
      - Label: { default: DNS (optional) }
        Parameters: [HostedZoneId, RecordName]
      - Label: { default: Network }
        Parameters: [VpcCidr, LatestAmiId]

Parameters:
  AllowedSshCidr:
    Type: String
    Description: Network allowed to SSH to the web tier, for example 203.0.113.10/32
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    ConstraintDescription: Must be a CIDR such as 203.0.113.10/32
  KeyName:
    Type: String
    Default: ""
    Description: Existing EC2 key pair for SSH. Leave empty to use Session Manager only.
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small]
  DBInstanceClass:
    Type: String
    Default: db.t4g.micro
    AllowedValues: [db.t4g.micro, db.t3.micro, db.t4g.small]
  HostedZoneId:
    Type: String
    Default: ""
    Description: Route 53 hosted zone ID. Leave empty to skip the DNS record.
  RecordName:
    Type: String
    Default: ""
    Description: Full name for the web tier, for example test1.marckenterprise.com
  VpcCidr:
    Type: String
    Default: 10.3.0.0/16
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/16$'
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Conditions:
  HasKey: !Not [!Equals [!Ref KeyName, ""]]
  HasDns: !And
    - !Not [!Equals [!Ref HostedZoneId, ""]]
    - !Not [!Equals [!Ref RecordName, ""]]

Mappings:
  # Index of each /24 inside the VPC CIDR (see !Cidr below).
  Subnets:
    Index: { Web: 0, App: 10, DbA: 20, DbB: 21 }

Resources:
  # ------------------------------------------------------------------ network
  Vpc:
    Type: AWS::EC2::VPC
    DeletionPolicy: Retain          # the retained database lives here
    UpdateReplacePolicy: Retain
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-vpc" }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-igw" }]

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  WebSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [!FindInMap [Subnets, Index, Web], !Cidr [!Ref VpcCidr, 32, 8]]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-web" }]

  AppSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [!FindInMap [Subnets, Index, App], !Cidr [!Ref VpcCidr, 32, 8]]
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-app" }]

  DbSubnetA:
    Type: AWS::EC2::Subnet
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [!FindInMap [Subnets, Index, DbA], !Cidr [!Ref VpcCidr, 32, 8]]
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-db-a" }]

  DbSubnetB:
    Type: AWS::EC2::Subnet
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [!FindInMap [Subnets, Index, DbB], !Cidr [!Ref VpcCidr, 32, 8]]
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-db-b" }]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-public" }]

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  WebSubnetRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref WebSubnet
      RouteTableId: !Ref PublicRouteTable

  # The app subnet gets its own table with no internet route. The db subnets use the
  # VPC main table (also no internet route), so nothing tied to them is deleted with the stack.
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-private" }]

  AppSubnetRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref AppSubnet
      RouteTableId: !Ref PrivateRouteTable

  # ----------------------------------------------------------- security groups
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Web tier - HTTP from anywhere, SSH from the allowed network
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: HTTP }
        - { IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: !Ref AllowedSshCidr, Description: SSH }
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-web" }]

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: App tier - SSH only from the web subnet
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Select [!FindInMap [Subnets, Index, Web], !Cidr [!Ref VpcCidr, 32, 8]]
          Description: SSH from the web subnet
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-app" }]

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      GroupDescription: DB tier - MySQL only from the app subnet
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          CidrIp: !Select [!FindInMap [Subnets, Index, App], !Cidr [!Ref VpcCidr, 32, 8]]
          Description: MySQL from the app subnet
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-db" }]

  # ----------------------------------------------------------------- compute
  WebInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref WebSubnet
      SecurityGroupIds: [!Ref WebSecurityGroup]
      KeyName: !If [HasKey, !Ref KeyName, !Ref AWS::NoValue]
      MetadataOptions: { HttpTokens: required }
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          dnf install -y httpd
          echo "<h1>Marck Enterprise test stack ${AWS::StackName}</h1>" > /var/www/html/index.html
          systemctl enable --now httpd
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-web" }]

  WebAddress:
    Type: AWS::EC2::EIP
    DependsOn: GatewayAttachment
    Properties:
      Domain: vpc
      InstanceId: !Ref WebInstance

  AppInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref AppSubnet
      SecurityGroupIds: [!Ref AppSecurityGroup]
      KeyName: !If [HasKey, !Ref KeyName, !Ref AWS::NoValue]
      MetadataOptions: { HttpTokens: required }
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-app" }]

  # ---------------------------------------------------------------- database
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      DBSubnetGroupDescription: !Sub "${AWS::StackName} database subnets"
      SubnetIds: [!Ref DbSubnetA, !Ref DbSubnetB]

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Retain          # case study: deleting the stack must not delete RDS
    UpdateReplacePolicy: Retain
    Properties:
      Engine: mysql
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: "20"
      StorageType: gp3
      StorageEncrypted: true
      MasterUsername: admin
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups: [!Ref DbSecurityGroup]
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 1
      DeletionProtection: true
      CopyTagsToSnapshot: true
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-mysql" }]

  # --------------------------------------------------------------------- DNS
  WebDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasDns
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref RecordName
      Type: A
      TTL: "60"
      ResourceRecords: [!Ref WebAddress]

Outputs:
  WebUrl:
    Value: !If [HasDns, !Sub "http://${RecordName}", !Sub "http://${WebAddress}"]
  WebPublicIp:
    Value: !Ref WebAddress
  AppPrivateIp:
    Value: !GetAtt AppInstance.PrivateIp
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  DatabaseSecret:
    Description: Secrets Manager secret holding the admin password
    Value: !GetAtt Database.MasterUserSecret.SecretArn
  RetainedOnDelete:
    Value: VPC, DB subnets, DB subnet group, DB security group, RDS instance
