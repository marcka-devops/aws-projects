# CodeDeploy (EC2/on-premises) deployment spec. Used for the QA instance and both web fleets.
version: 0.0
os: linux

files:
  - source: /
    destination: /var/www/html

file_exists_behavior: OVERWRITE

permissions:
  - object: /var/www/html
    owner: apache
    group: apache
    mode: 755
    type:
      - directory
  - object: /var/www/html
    owner: apache
    group: apache
    mode: 644
    type:
      - file

hooks:
  BeforeInstall:
    - location: scripts/before_install.sh
      timeout: 300
      runas: root
  ApplicationStart:
    - location: scripts/start_server.sh
      timeout: 120
      runas: root
  ValidateService:
    - location: scripts/validate_service.sh
      timeout: 120
      runas: root
