# Marck Enterprise infrastructure delivery.
#   Pull request -> terraform plan for every stack, posted to the job summary (read-only role).
#   Merge to main -> plan and apply in stack order, inside the protected "production" environment.
#
# Needs these repository variables (Settings > Secrets and variables > Actions > Variables):
#   AWS_PLAN_ROLE_ARN, AWS_APPLY_ROLE_ARN, TF_STATE_BUCKET   (outputs of infra/stacks/00-bootstrap)
#   DOMAIN_NAME, ADMIN_CIDR, ALERT_EMAIL
# The jobs skip themselves until those variables are set, so CI stays green before setup.
name: Marck Enterprise Terraform

on:
  pull_request:
    paths:
      - "marck-enterprise-project/infra/**"
      - "marck-enterprise-project/functions/**"
      - "marck-enterprise-project/website/**"
      - "marck-enterprise-project/config/**"
      - ".github/workflows/marck-enterprise-terraform.yml"
  push:
    branches: [main]
    paths:
      - "marck-enterprise-project/infra/**"
      - "marck-enterprise-project/functions/**"
      - "marck-enterprise-project/website/**"
      - "marck-enterprise-project/config/**"
      - ".github/workflows/marck-enterprise-terraform.yml"
  workflow_dispatch:

concurrency:
  group: marck-enterprise-terraform
  cancel-in-progress: false

env:
  TF_VERSION: "1.16.4"
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"
  TF_VAR_state_bucket: ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
  TF_VAR_admin_cidr: ${{ vars.ADMIN_CIDR }}
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
  TF_VAR_github_owner: ${{ github.repository_owner }}
  TF_VAR_github_repo: ${{ github.event.repository.name }}

jobs:
  plan:
    if: github.event_name == 'pull_request' && vars.AWS_PLAN_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        stack: [10-network, 20-security, 30-data, 40-storage, 50-compute, 60-delivery, 70-self-service]
    defaults:
      run:
        working-directory: marck-enterprise-project/infra/stacks/${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Init
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=${{ env.AWS_REGION }}"
      - name: Plan
        run: |
          set -o pipefail
          terraform plan -input=false -lock=false -no-color -out=tfplan | tee plan.txt
          {
            echo "### ${{ matrix.stack }}"
            echo '```'
            grep -E '^(Plan:|No changes|Changes to Outputs)' plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.AWS_APPLY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: marck-enterprise-project
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600
      - name: Plan and apply in dependency order
        run: |
          set -euo pipefail
          for stack in 10-network 20-security 30-data 40-storage 50-compute 60-delivery 70-self-service; do
            echo "::group::$stack"
            terraform -chdir="infra/stacks/$stack" init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=${AWS_REGION}"
            terraform -chdir="infra/stacks/$stack" plan -input=false -out=tfplan
            terraform -chdir="infra/stacks/$stack" apply -input=false tfplan
            echo "::endgroup::"
          done
